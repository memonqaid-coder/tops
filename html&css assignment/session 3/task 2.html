<form action="/submit-review" method="POST">
    <h2>Write a Product Review</h2>

    <!-- Username Field: Required -->
    <div>
        <label for="username">Your Name:</label><br>
        <input type="text" id="username" name="username" placeholder="Enter your full name" required>
    </div>
    <br>

    <!-- Rating Dropdown: Required with default unselectable option -->
    <div>
        <label for="rating">Rating (1 to 5 Stars):</label><br>
        <select id="rating" name="rating" required>
            <option value="" disabled selected hidden>Select a rating</option>
            <option value="1">1 - Very Poor</option>
            <option value="2">2 - Poor</option>
            <option value="3">3 - Average</option>
            <option value="4">4 - Good</option>
            <option value="5">5 - Excellent</option>
        </select>
    </div>
    <br>

    <!-- Review Textarea: Required with minlength="20" -->
    <div>
        <label for="review">Your Review:</label><br>
        <textarea id="review" name="review" rows="5" cols="40" minlength="20" placeholder="Write at least 20 characters about your experience..." required></textarea>
    </div>
    <br>

    <!-- Submit Button -->
    <button type="submit">Submit Review</button>
</form>
