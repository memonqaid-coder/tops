<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Tag Bio Links | VORTEX_RX</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(18, 24, 38, 0.75);
            --accent-cyan: #00f0ff;
            --accent-purple: #7000ff;
            --twitch-color: #9146FF;
            --discord-color: #5865F2;
            --steam-color: #171a21;
            --steam-hover: #2a475e;
            --text-main: #f0f4f8;
            --text-muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Animated Cyber Background Elements */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -2;
        }

        .bg-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.4;
            animation: pulse 8s infinite alternate;
        }

        .glow-1 {
            top: -50px;
            left: -50px;
            background: var(--accent-cyan);
        }

        .glow-2 {
            bottom: -50px;
            right: -50px;
            background: var(--accent-purple);
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            100% { transform: scale(1.3); opacity: 0.6; }
        }

        /* Container Layout using CSS Grid & Flexbox */
        .bio-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 
                        inset 0 0 15px rgba(0, 240, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Avatar Section */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            display: block;
        }

        .status-badge {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background-color: #00ff66;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 3px solid #0b0e14;
            box-shadow: 0 0 8px #00ff66;
        }

        /* User Info Header */
        .gamer-alias {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            margin-bottom: 4px;
            text-align: center;
        }

        .gamer-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent-cyan);
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .gamer-bio {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 28px;
            max-width: 90%;
        }

        /* Link Buttons Container (Flexbox Column) */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Social Link Button Component */
        .gamer-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-radius: 14px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-left i {
            font-size: 1.5rem;
            width: 28px;
            text-align: center;
        }

        .btn-action-icon {
            font-size: 0.9rem;
            opacity: 0.6;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* Specific Button Themes */
        .btn-twitch {
            background: linear-gradient(135deg, rgba(145, 70, 255, 0.25), rgba(145, 70, 255, 0.05));
            border-color: rgba(145, 70, 255, 0.4);
        }

        .btn-twitch:hover {
            background: var(--twitch-color);
            box-shadow: 0 0 20px rgba(145, 70, 255, 0.6);
            transform: translateY(-3px);
        }

        .btn-discord {
            background: linear-gradient(135deg, rgba(88, 101, 242, 0.25), rgba(88, 101, 242, 0.05));
            border-color: rgba(88, 101, 242, 0.4);
        }

        .btn-discord:hover {
            background: var(--discord-color);
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.6);
            transform: translateY(-3px);
        }

        .btn-steam {
            background: linear-gradient(135deg, rgba(42, 71, 94, 0.4), rgba(23, 26, 33, 0.2));
            border-color: rgba(102, 192, 244, 0.3);
        }

        .btn-steam:hover {
            background: var(--steam-hover);
            box-shadow: 0 0 20px rgba(102, 192, 244, 0.5);
            transform: translateY(-3px);
        }

        .gamer-btn:hover .btn-action-icon {
            opacity: 1;
            transform: translateX(4px);
        }

        /* Footer Tag */
        .footer-tag {
            margin-top: 28px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* RESPONSIVE DESIGN (Media Queries) */
        
        /* Desktop Screens (Upgrades visual scale) */
        @media (min-width: 768px) {
            .bio-container {
                padding: 48px 36px;
            }

            .avatar {
                width: 135px;
                height: 135px;
            }

            .gamer-alias {
                font-size: 2.2rem;
            }

            .gamer-title {
                font-size: 1.15rem;
            }

            .gamer-btn {
                padding: 18px 26px;
                font-size: 1.15rem;
            }
        }

        /* Extra Small Mobile Screens */
        @media (max-width: 380px) {
            .bio-container {
                padding: 30px 18px;
            }

            .gamer-alias {
                font-size: 1.5rem;
            }

            .gamer-btn {
                padding: 14px 16px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Grid Effects -->
    <div class="bg-grid"></div>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Main Bio Card Container -->
    <main class="bio-container">
        
        <!-- Avatar Profile -->
        <div class="avatar-wrapper">
            <img src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?q=80&w=300" alt="Gamer Avatar" class="avatar">
            <span class="status-badge" title="Live Now / Online"></span>
        </div>

        <!-- Gamer Tag & Bio Header -->
        <h1 class="gamer-alias">VORTEX_RX</h1>
        <div class="gamer-title">FPS & Cyberpunk Streamer</div>
        <p class="gamer-bio">Grinding ranked playlists, building custom rigs, and sharing high-octane gameplay highlights daily.</p>

        <!-- Social & Platform Link Buttons -->
        <div class="links-wrapper">
            
            <!-- Twitch Link -->
            <a href="https://twitch.tv" target="_blank" rel="noopener noreferrer" class="gamer-btn btn-twitch">
                <div class="btn-left">
                    <i class="fa-brands fa-twitch"></i>
                    <span>Twitch Live Stream</span>
                </div>
                <i class="fa-solid fa-arrow-right-long btn-action-icon"></i>
            </a>

            <!-- Discord Link -->
            <a href="https://discord.com" target="_blank" rel="noopener noreferrer" class="gamer-btn btn-discord">
                <div class="btn-left">
                    <i class="fa-brands fa-discord"></i>
                    <span>Join The Discord</span>
                </div>
                <i class="fa-solid fa-arrow-right-long btn-action-icon"></i>
            </a>

            <!-- Steam Link -->
            <a href="https://store.steampowered.com" target="_blank" rel="noopener noreferrer" class="gamer-btn btn-steam">
                <div class="btn-left">
                    <i class="fa-brands fa-steam"></i>
                    <span>Steam Community</span>
                </div>
                <i class="fa-solid fa-arrow-right-long btn-action-icon"></i>
            </a>

        </div>

        <div class="footer-tag">Powered by GamerBio</div>

    </main>

</body>
</html>
