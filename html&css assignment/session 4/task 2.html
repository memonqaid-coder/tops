<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Restaurant Card</title>
</head>
<body>

    <main>
        <!-- Restaurant Card -->
        <article class="restaurant-card">
            
            <!-- Restaurant Banner & Badges -->
            <figure>
                <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=600" 
                     alt="Ambiance of Bukhara Restaurant" 
                     width="350" 
                     height="200">
                <figcaption>30% OFF up to ₹75</figcaption>
            </figure>

            <!-- Header: Restaurant Name & Cuisine -->
            <header>
                <h2>Bukhara</h2>
                <p>North Indian, Kebabs, Mughlai</p>
                <p><small>Connaught Place, New Delhi</small></p>
            </header>

            <!-- Main Info: Price for two -->
            <section>
                <p><strong>₹2,500 for two</strong></p>
            </section>

            <!-- Footer: Rating & Delivery Time -->
            <footer>
                <div class="rating-badge">
                    <span>★ 4.6</span> (5,000+ reviews)
                </div>
                <div class="delivery-time">
                    <time datetime="PT35M">35 mins</time> • 3.5 km
                </div>
            </footer>

        </article>
    </main>

</body>
</html>
