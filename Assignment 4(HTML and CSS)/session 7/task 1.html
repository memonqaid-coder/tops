<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social App Icons - Flexbox Layout</title>
    <style>
        /* Global Page Setup */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; /* Modern dark background */
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            margin-bottom: 24px;
            font-size: 20px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* FLEXBOX CONTAINER 
           align-items centers items vertically, justify-content distributes 
           equal spacing around each flex item. */
        .social-container {
            display: flex;
            justify-content: space-evenly; /* Equal space before, between, and after items */
            align-items: center;
            width: 100%;
            max-width: 500px;
            background-color: #1e293b;
            padding: 24px 16px;
            border-radius: 16px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Flex Item Anchor Links */
        .app-link {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background-color: #334155;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                        background-color 0.25s ease;
            text-decoration: none;
        }

        /* Vector SVG Icon Sizing */
        .app-icon {
            width: 32px;
            height: 32px;
            fill: #ffffff;
            transition: fill 0.2s ease;
        }

        /* Hover & Active States with Brand Color Accents */
        .app-link:hover {
            transform: translateY(-6px) scale(1.05);
        }

        .app-link.instagram:hover {
            background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
            box-shadow: 0 8px 20px rgba(214, 36, 159, 0.4);
        }

        .app-link.whatsapp:hover {
            background-color: #25d366;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.4);
        }

        .app-link.zomato:hover {
            background-color: #cb202d;
            box-shadow: 0 8px 20px rgba(203, 32, 45, 0.4);
        }

        .app-link.spotify:hover {
            background-color: #1db954;
            box-shadow: 0 8px 20px rgba(29, 185, 84, 0.4);
        }
    </style>
</head>
<body>

    <!-- Flexbox Container -->

    </div>

</body>
</html>
