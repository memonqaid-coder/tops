<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Override Bootstrap Primary Button</title>

    <!-- 1. BOOTSTRAP CSS (Loaded First) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- 2. CUSTOM STYLESHEET (Loaded AFTER Bootstrap to override default styles) -->
    <style>
        /* Base page setup */
        body {
            background-color: #0f1017;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .movie-card {
            background-color: #1a1a24;
            border: 1px solid #2a2a38;
            border-radius: 12px;
            max-width: 400px;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        /* -----------------------------------------------------------------
           OVERRIDING BOOTSTRAP'S .btn-primary 
           Custom Shade: Crimson Red (#f84464) instead of Default Blue (#0d6efd)
           ----------------------------------------------------------------- */
        .btn-primary {
            background-color: #f84464;
            border-color: #f84464;
            color: #ffffff;
            font-weight: 700;
            padding: 10px 24px;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }

        /* Hover, Focus, Active & Disabled States */
        .btn-primary:hover,
        .btn-primary:focus {
            background-color: #d83350;
            border-color: #d83350;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(248, 68, 100, 0.4);
        }

        .btn-primary:active,
        .btn-primary.active {
            background-color: #b8233e !important;
            border-color: #b8233e !important;
            color: #ffffff !important;
        }

        .btn-primary:disabled {
            background-color: #f84464;
            border-color: #f84464;
            opacity: 0.65;
        }
    </style>
</head>
<body>

    <main class="container py-5">
        <div class="movie-card p-4">
            
            <div class="position-relative mb-3">
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=600" alt="Inception Movie Poster" class="w-100 rounded-3" style="height: 220px; object-fit: cover;">
                <span class="badge bg-warning text-dark position-absolute top-0 end-0 m-2 fw-bold">
                    <i class="bi bi-star-fill"></i> 8.8/10
                </span>
            </div>

            <h1 class="h4 fw-bold mb-1">Inception</h1>
            <p class="text-secondary small mb-3">Sci-Fi / Action &bull; 2h 28m &bull; UA</p>
            <p class="small text-light opacity-75 mb-4">
                A thief who steals corporate secrets through dream-sharing technology is given the inverse task of planting an idea.
            </p>

            <!-- BOOTSTRAP PRIMARY BUTTON USING OVERRIDDEN CSS -->
            <button class="btn btn-primary w-100 d-inline-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-ticket-perforated-fill fs-5"></i>
                <span>Book Ticket</span>
            </button>

        </div>
    </main>

</body>
</html>
