<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links Form with Input Icons</title>
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            
            /* Social Brand Colors */
            --instagram-color: #e4405f;
            --linkedin-color: #0a66c2;
            --twitter-color: #1da1f2;
            --github-color: #f0f6fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .form-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        /* ICON INPUT CONTAINER (Key Technique) */
        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Positioned Icon Inside Field */
        .input-icon-wrapper i {
            position: absolute;
            left: 14px;
            font-size: 1.2rem;
            pointer-events: none; /* Allows user to click through the icon into input */
            transition: color 0.2s ease;
        }

        /* Specific Brand Icon Colors */
        .input-icon-wrapper .fa-instagram { color: var(--instagram-color); }
        .input-icon-wrapper .fa-linkedin { color: var(--linkedin-color); }
        .input-icon-wrapper .fa-x-twitter { color: var(--twitter-color); }
        .input-icon-wrapper .fa-github { color: var(--github-color); }

        /* Input Styling with Left Padding to Prevent Text Overlay */
        .input-icon-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 44px; /* 44px Left Padding creates space for icon */
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-icon-wrapper input::placeholder {
            color: var(--text-secondary);
        }

        /* Focus State Styling */
        .input-icon-wrapper input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <div class="form-card">
        <div class="form-header">
            <h2>Add Social Profiles</h2>
            <p>Connect your social media handles to your bio page</p>
        </div>

        <form id="socialLinksForm">
            <!-- Instagram Input -->
            <div class="form-group">
                <label for="instagram">Instagram</label>
                <div class="input-icon-wrapper">
                    <i class="fa-brands fa-instagram"></i>
                    <input type="text" id="instagram" placeholder="instagram.com/username">
                </div>
            </div>

            <!-- LinkedIn Input -->
            <div class="form-group">
                <label for="linkedin">LinkedIn</label>
                <div class="input-icon-wrapper">
                    <i class="fa-brands fa-linkedin"></i>
                    <input type="text" id="linkedin" placeholder="linkedin.com/in/username">
                </div>
            </div>

            <!-- X / Twitter Input -->
            <div class="form-group">
                <label for="twitter">X (Twitter)</label>
                <div class="input-icon-wrapper">
                    <i class="fa-brands fa-x-twitter"></i>
                    <input type="text" id="twitter" placeholder="x.com/username">
                </div>
            </div>

            <!-- GitHub Input -->
            <div class="form-group">
                <label for="github">GitHub</label>
                <div class="input-icon-wrapper">
                    <i class="fa-brands fa-github"></i>
                    <input type="text" id="github" placeholder="github.com/username">
                </div>
            </div>

            <button type="submit" class="btn-submit">Save Links</button>
        </form>
    </div>

</body>
</html>
